# Merge this example into CLIProxyAPI's config.yaml.
# CPA's built-in provider owns and authenticates these raw API keys.
api-keys:
  - "replace-with-a-real-api-key"

plugins:
  enabled: true
  dir: "plugins"
  configs:
    key-model-access:
      enabled: true
      priority: 100

      # Safe default: use an inline, empty v2 document. Authenticated CPA keys
      # without a policy are allowed to use all interceptor-covered models.
      version: 2
      policies: []

      # Optional persistence. Do not enable this until the target file exists:
      # copy/create a v2 document matching policies.example.yaml first. A missing
      # policy_file currently makes the plugin fail closed.
      # Relative paths resolve from CLIProxyAPI's working directory.
      # policy_file: "config/key-model-access-policies.yaml"
